name: AgriResolve CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-quality:
    name: Soroban Smart Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt

      - name: Run Soroban contract unit tests
        working-directory: agriresolve-contract
        run: cargo test --verbose

      - name: Build WebAssembly contract
        working-directory: agriresolve-contract
        run: stellar contract build

  web-quality:
    name: Next.js 15 Web Application (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: agriresolve-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: agriresolve-app/apps/web
        run: pnpm install --frozen-lockfile

      - name: Run Next.js Production Build
        working-directory: agriresolve-app/apps/web
        run: pnpm run build
